version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vw_postgres_db_local
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: vw_catalog_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d vw_catalog_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: vw_fastapi_app_local
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      # CORREÇÃO: Mapeia a pasta 'storage' local para o caminho correto dentro do contêiner
      - ./storage:/code/app/static
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_local: