name: "Deploy API to ECS"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # Substitua 'dev' pelo nome do seu ambiente, se for diferente.
  # Isso deve corresponder ao 'var.env' do seu Terraform.
  ENVIRONMENT: "dev" 
  AWS_REGION: "us-east-1" # Substitua pela sua região da AWS

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define ECR repository and image tag
        id: ecr-meta
        run: |
          ECR_REPOSITORY_NAME="ecr-repo-${{ env.ENVIRONMENT }}"
          IMAGE_NAME="${{ github.event.repository.name }}/${ECR_REPOSITORY_NAME}"
          IMAGE_TAG="${{ github.ref_name }}"
          
          echo "ECR_REPOSITORY_NAME=${ECR_REPOSITORY_NAME}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Download task definition
        id: download-task-def
        run: |
          TASK_DEF_FAMILY="api-task-${{ env.ENVIRONMENT }}"
          echo "TASK_DEF_FAMILY=${TASK_DEF_FAMILY}" >> $GITHUB_ENV
          aws ecs describe-task-definition --task-definition ${TASK_DEF_FAMILY} --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: "container-app-${{ env.ENVIRONMENT }}"
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: "ecs-service-${{ env.ENVIRONMENT }}"
          cluster: "ecs-cluster-${{ env.ENVIRONMENT }}"
          wait-for-service-stability: true # Espera o deploy terminar com sucesso